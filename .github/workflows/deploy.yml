name: Publicar Beam Analyzer
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BASE_PATH: /ANALIZADOR_VIGAS/
      PORT: 5000
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4
      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile
      - name: Compilar la aplicación
        run: pnpm --filter @workspace/beam-analyzer run build
      - name: Preparar los archivos para publicar
        uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/beam-analyzer/dist/public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
